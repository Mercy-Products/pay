<title>BEM Direct Supply — order</title>
<meta name="robots" content="noindex">
<style>
:root{--ink:#16202b;--muted:#5b6b7b;--line:#e3e8ee;--blue:#1f63c6;--red:#e3262c;--bg:#eef3f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 48px}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:16px;box-shadow:0 6px 24px rgba(20,40,70,.06)}
.brand{font-weight:800;letter-spacing:2.5px;color:var(--blue);font-size:13px}
.deal{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:12px;letter-spacing:1.5px;padding:4px 9px;border-radius:5px;margin-left:8px;vertical-align:1px}
h1{font-size:30px;margin:14px 0 18px;line-height:1.15}
.banner{width:100%;border-radius:12px;display:block;margin-bottom:18px}
.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0}
.row + .row{border-top:1px solid var(--line)}
.row .r{text-align:right;white-space:nowrap;font-weight:700}
.row s{color:#9aa6b2;font-weight:500;margin-right:6px}
.sub{color:var(--muted);font-size:14px}
.zip{margin-top:14px}
.zip label{display:block;font-weight:700;margin-bottom:6px}
.zip input{font-size:18px;padding:10px 12px;border:1px solid #c9d3de;border-radius:9px;width:170px;letter-spacing:1px}
.zip .hint{color:var(--muted);font-size:14px;margin-top:6px;min-height:20px}
.opt{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
.opt h2{margin:0;font-size:20px}
.opt .amt{grid-row:1/3;grid-column:2;font-size:26px;font-weight:800}
.opt p{margin:0;color:var(--muted);font-size:15px}
.opt a{grid-column:1/3;display:block;text-align:center;background:var(--blue);color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:10px;margin-top:14px}
.opt a.off{background:#b9c4d0;pointer-events:none}
.foot{color:var(--muted);font-size:13px;padding:0 4px}
.err{color:var(--red);font-weight:700}
.ends{display:inline-block;background:#fff1f1;color:var(--red);font-weight:700;font-size:14px;padding:6px 10px;border-radius:7px;margin:12px 0 0;letter-spacing:.5px}
.pick{display:flex;gap:16px;align-items:center;text-decoration:none;color:var(--ink);padding:14px}
.pick img{width:110px;height:110px;border-radius:10px;flex:none}
.more{display:block;text-align:center;text-decoration:none;color:#fff;background:var(--blue);font-size:18px;padding:18px}
.pick s{color:#9aa6b2} .pick .now{color:var(--red);font-size:18px}
@media(max-width:480px){h1{font-size:25px}.opt .amt{font-size:22px}.box{padding:20px}}
</style></head>

    const rate = !fl ? 0 : (D.fl.zips[z] ?? D.fl.prefix[z.slice(0, 3)] ?? 7);
    const tax = r2(b.goods * rate / 100), ach = r2(b.goods + tax), card = r2(ach * (1 + D.cardFee / 100)), bnpl = r2(ach * (1 + D.bnplFee / 100));
    $('taxlbl').textContent = rate ? `Sales tax (${rate}%)` : 'Sales tax'; $('tax').textContent = fmt(tax);
    $('sum').textContent = fmt(ach); $('achAmt').textContent = fmt(ach); $('cardAmt').textContent = fmt(card); $('bnplAmt').textContent = fmt(bnpl);
    const L = b.links[rate] || {}, a = L.ach, c = L.card, k = L.bnpl;
    for (const [btn, url] of [['achBtn', a], ['cardBtn', c], ['bnplBtn', k]]) {
      const el = $(btn), on = ok && !!url;
      el.classList.toggle('off', !on); on ? el.href = url : el.removeAttribute('href');
    }
    $('hint').innerHTML = !ok ? 'Enter the ZIP code where we deliver, then choose how to pay.'
      : !a ? '<span class="err">Online payment is not ready yet. Please call +1 (888) 602-5822.</span>'
      : rate ? `Sales tax ${rate}% applies to this ZIP code.` : 'Free shipping to this ZIP code.';
  };
  $('z').addEventListener('input', update); update();
}
</script></body></html>
