h1{font-size:30px;margin:14px 0 18px;line-height:1.15}

.sub{color:var(--muted);font-size:14px}
.zip{margin-top:14px}

.opt{display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
.opt h2{margin:0;font-size:20px}
.opt .amt{grid-row:1/3;grid-column:2;font-size:26px;font-weight:800}

.hero .sub{color:#c6cfda;font-size:16px}
.cd{display:flex;justify-content:center;gap:8px;margin:18px 0 8px}

.cd small{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.85;margin-top:4px}

.pick{display:flex;gap:16px;align-items:center;text-decoration:none;color:var(--ink);padding:14px;transition:box-shadow .15s,transform .15s}

.pick img{width:110px;height:110px;border-radius:10px;flex:none}
.pick .info{flex:1;min-width:0}
.pick s{color:#9aa6b2} .pick .now{color:var(--red);font-size:18px}
.save{display:inline-block;margin-top:6px;background:#e6f6ec;color:#127a3a;font-weight:800;font-size:14px;padding:4px 9px;border-radius:6px}
.row.saverow{color:#127a3a;font-weight:700}

.lead small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:9px}

  const bf = (b0 ? `${deal} - ${b0.name} - ${fmt(b0.goods)}` : 'Black Friday list page') + ` | source: ${SRC || 'direct'}`;
  return `<div class="box lead"><h2>${title}</h2><p>${text}</p>
  <iframe src="https://api.leadconnectorhq.com/widget/form/${LEAD_FORM}?bf=${encodeURIComponent(bf)}" style="width:100%;height:862px;border:none;border-radius:8px"
    id="inline-${LEAD_FORM}" data-layout="{'id':'INLINE'}" data-trigger-type="alwaysShow" data-trigger-value="" data-activation-type="alwaysActivated"
    data-activation-value="" data-deactivation-type="neverDeactivate" data-deactivation-value="" data-form-name="BF pay page - Hold this price"
    data-height="862" data-layout-iframe-id="inline-${LEAD_FORM}" data-form-id="${LEAD_FORM}" title="BF pay page - Hold this price"></iframe></div>`;
};
// GHL's resize script is loaded once the iframe is on the page
const wireLead = () => { if (document.getElementById('inline-' + LEAD_FORM) && !document.getElementById('ghlEmbed')) {
  const sc = document.createElement('script'); sc.id = 'ghlEmbed'; sc.src = 'https://link.msgsndr.com/js/form_embed.js'; document.body.appendChild(sc); } };
const withRef = url => !url || !REF ? url : url + (url.includes('?') ? '&' : '?') + 'client_reference_id=' + encodeURIComponent(REF);
const ended = D.closed || Date.now() >= Date.parse(D.deadline);
const ENDS = 'Ends Nov 29, 6 PM ET';
const MORE = `<div class="box more"><div class="call">Need more deals? Call <a href="tel:+18886025822">+1 (888) 602-5822</a></div>
  <div class="site">or visit <a href="https://www.bemdirect.com">bemdirect.com</a></div></div>`;
// countdown to the deadline; every [data-cd] element is refreshed each second, the page reloads into "ended" at zero
const left = () => Math.max(0, Date.parse(D.deadline) - Date.now());
const parts = ms => { const s = Math.floor(ms / 1000); return [Math.floor(s / 86400), Math.floor(s / 3600) % 24, Math.floor(s / 60) % 60, s % 60]; };
const p2 = n => String(n).padStart(2, '0');
const tick = () => {
  const ms = left(), [d, h, m, sec] = parts(ms);
  document.querySelectorAll('[data-cd=big]').forEach(el => el.innerHTML =
    [[d, d === 1 ? 'day' : 'days'], [p2(h), 'hours'], [p2(m), 'min'], [p2(sec), 'sec']].map(([v, l]) => `<div><b>${v}</b><small>${l}</small></div>`).join(''));
  document.querySelectorAll('[data-cd=line]').forEach(el => el.textContent = `Offer ends in ${d}d ${p2(h)}h ${p2(m)}m ${p2(sec)}s`);
  if (!ms) location.reload();
};
const b = ended ? null : D.bundles[key];
const app = document.getElementById('app');
// Florida ZIP codes start with 320-339, 341, 342, 344, 346, 347, 349
const isFL = z => /^(3[23]\d|34[124679])\d{2}$/.test(z);
if (ended) {
  app.innerHTML = `<div class="box"><div class="brand">BEM DIRECT SUPPLY</div><h1>This offer has ended</h1>
  <p class="sub">The Black Friday offer ended on Nov 29 at 6 PM ET.</p></div>
  ${MORE}`;
} else if (!b) {
  // no bundle in the link: list every Black Friday bundle
  app.innerHTML = `<div class="box hero"><div class="brand">BEM DIRECT SUPPLY</div>
    <h1>Black Friday <span>offers</span></h1><div class="sub">Free shipping · pick your bundle</div>
    <div class="cd" data-cd="big"></div><div class="cdnote">Ends Nov 29, 6 PM ET</div></div>` +
    Object.entries(D.bundles).filter(([k, x]) => !x.hidden).map(([k, x]) => `<a class="box pick" href="?b=${k}${keep}"><img src="${x.img}" alt="">
      <div class="info"><b>${x.name}</b><div class="sub"><s>${fmt(x.regular)}</s> <b class="now">${fmt(x.goods)}</b></div>
      <div class="save">You save ${whole(x.regular - x.goods)}</div><br>
      <span class="buy">Buy now →</span></div></a>`).join('') +
    leadBox('Not ready to order yet?', 'Leave your contact and we will hold the Black Friday price for you and send you the details.', null) + MORE;
  wireLead(null);
  tick(); setInterval(tick, 1000);
} else {
  app.innerHTML = `
  <div class="box">
    <div class="brand">BEM DIRECT SUPPLY <span class="deal">BLACK FRIDAY</span></div>
    <h1>Complete your order</h1>
    <div class="cdline" data-cd="line"></div>
    <img class="banner" src="${b.img}" alt="">
    <div class="row"><div>${b.name}<div class="sub">${b.perRollText || ('$' + b.perRoll + ' per roll')} · ${b.regPerRollText || ('regular $' + b.regPerRoll)}</div></div>
      <div class="r"><s>${fmt(b.regular)}</s>${fmt(b.goods)}</div></div>
    <div class="row saverow"><div>Your Black Friday savings</div><div class="r">${whole(b.regular - b.goods)}</div></div>
    <div class="row" id="taxrow"><div id="taxlbl">Sales tax</div><div class="r" id="tax"></div></div>
    <div class="row"><div><b>Delivered products</b><div class="sub">Free shipping · delivery in about ${b.custom ? '80+ days' : '1 week'}</div></div><div class="r" id="sum"></div></div>
    <div class="zip"><label for="z">Delivery ZIP code</label>
      <input id="z" inputmode="numeric" maxlength="5" placeholder="e.g. 30301" autocomplete="postal-code">
      <div class="hint" id="hint">Enter the ZIP code where we deliver, then choose how to pay.</div></div>
  </div>
  <div class="box opt"><h2>ACH bank transfer</h2><div class="amt" id="achAmt"></div>
    <p>No added processing fee. Bank payments can take a few business days to clear.</p>
    <a id="achBtn" class="off">Continue with ACH bank transfer</a></div>
  <div class="box opt"><h2>Credit or debit card</h2><div class="amt" id="cardAmt"></div>
    <p>Includes a ${D.cardFee}% card processing fee.</p>
    <a id="cardBtn" class="off">Continue with credit or debit card</a></div>
  <div class="box opt"><h2>Klarna or Affirm</h2><div class="amt" id="bnplAmt"></div>
    <p>Pay over time. Includes a ${D.bnplFee}% Klarna / Affirm processing fee. Approval and plans are set by the provider.</p>
    <a id="bnplBtn" class="off">Continue with Klarna or Affirm</a></div>
  ${leadBox('Not ready to pay today?', 'Leave your contact and we will hold this Black Friday price for you. A specialist will reach out to answer any questions.', key)}
  <div class="foot">Limited time Black Friday offer, ${ENDS}. You enter the delivery address and phone number on the next page.
    Questions: +1 (888) 602-5822 · sales@bemdirect.com</div>`;
  const $ = id => document.getElementById(id);
  const update = () => {
    const z = $('z').value.replace(/\D/g, '').slice(0, 5); $('z').value = z;
    const ok = z.length === 5, fl = ok && isFL(z);
    // Florida: 6% + county surtax by ZIP; unknown Florida ZIP -> most common rate of its 3-digit area
    const rate = !fl ? 0 : (D.fl.zips[z] ?? D.fl.prefix[z.slice(0, 3)] ?? 7);
    const tax = r2(b.goods * rate / 100), ach = r2(b.goods + tax), card = r2(ach * (1 + D.cardFee / 100)), bnpl = r2(ach * (1 + D.bnplFee / 100));
    $('taxlbl').textContent = rate ? `Sales tax (${rate}%)` : 'Sales tax'; $('tax').textContent = fmt(tax);
    $('sum').textContent = fmt(ach); $('achAmt').textContent = fmt(ach); $('cardAmt').textContent = fmt(card); $('bnplAmt').textContent = fmt(bnpl);
    const L = b.links[rate] || {}, a = L.ach, c = L.card, k = L.bnpl;
    for (const [btn, url] of [['achBtn', a], ['cardBtn', c], ['bnplBtn', k]]) {
      const el = $(btn), on = ok && !!url;
      el.classList.toggle('off', !on); on ? el.href = withRef(url) : el.removeAttribute('href');
    }
    $('hint').innerHTML = !ok ? 'Enter the ZIP code where we deliver, then choose how to pay.'
      : !a ? '<span class="err">Online payment is not ready yet. Please call +1 (888) 602-5822.</span>'
      : rate ? `Sales tax ${rate}% applies to this ZIP code.` : 'Free shipping to this ZIP code.';
  };
  $('z').addEventListener('input', update); update();
  wireLead(key);
  track('view_item', { item_id: key, currency: 'USD', value: b.goods, items: [{ item_id: key, item_name: b.name, price: b.goods, quantity: 1 }] });
  let zipCounted = false;
  $('z').addEventListener('input', () => { if (!zipCounted && $('z').value.length === 5) { zipCounted = true; track('zip_entered', { item_id: key }); } });
  for (const [btn, name] of [['achBtn', 'ach'], ['cardBtn', 'card'], ['bnplBtn', 'klarna-affirm']])
    $(btn).addEventListener('pointerdown', () => { if ($(btn).href) track('begin_checkout', { item_id: key, payment_type: name, currency: 'USD', value: b.goods, items: [{ item_id: key, item_name: b.name, price: b.goods, quantity: 1 }] }); });
  tick(); setInterval(tick, 1000);
}
</script></body></html>
